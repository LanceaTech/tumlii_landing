# Netlify: a static site with no build step. The repo root is the site.
[build]
  publish = "."

# one address: www.tumlii.com -> tumlii.com
[[redirects]]
  from = "https://www.tumlii.com/*"
  to = "https://tumlii.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
